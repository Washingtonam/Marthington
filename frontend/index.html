<!doctype html>
<html lang="en">
  <head>

    <!-- BASIC -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- TITLE -->
    <title>
      Marthington Business OS
    </title>

    <!-- SEO -->
    <meta
      name="description"
      content="Marthington Business OS helps businesses manage inventory, sales, receipts, analytics, staff, invoices, and customer operations from one powerful platform."
    />

    <meta
      name="keywords"
      content="POS system, inventory management, business software, receipt generator, sales management, Marthington"
    />

    <meta
      name="author"
      content="Marthington"
    />

    <!-- THEME -->
    <meta
      name="theme-color"
      content="#16a34a"
    />

    <!-- OPEN GRAPH -->
    <meta
      property="og:title"
      content="Marthington Business OS"
    />

    <meta
      property="og:description"
      content="Smart inventory, POS, analytics, receipts, and business automation."
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- FAVICON -->
    <!-- Logo Icon with Grayscale on Inactive Tab -->
    <link
      rel="icon"
      type="image/png"
      href="/logo-icon.png"
      id="favicon"
    />

    <!-- APPLE ICON -->
    <link
      rel="apple-touch-icon"
      href="/logo-icon.png"
    />

    <!-- GOOGLE FONTS -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>

  <body>

    <div id="root"></div>

    <!-- Favicon Grayscale Effect Script -->
    <script>
      (function() {
        const faviconUrl = '/logo-icon.png';
        const originalFavicon = document.getElementById('favicon');
        
        // Create a canvas to apply grayscale filter
        const applyGrayscaleEffect = () => {
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            
            // Draw the image
            ctx.drawImage(img, 0, 0);
            
            // Apply grayscale filter
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
              const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
              data[i] = gray;     // red
              data[i + 1] = gray; // green
              data[i + 2] = gray; // blue
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Convert to favicon
            const grayscaleFavicon = canvas.toDataURL('image/png');
            originalFavicon.href = grayscaleFavicon;
          };
          img.src = faviconUrl;
        };
        
        // Handle visibility changes
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            // Tab is inactive - show grayscale
            applyGrayscaleEffect();
          } else {
            // Tab is active - show original icon
            originalFavicon.href = faviconUrl;
          }
        });
      })();
    </script>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
